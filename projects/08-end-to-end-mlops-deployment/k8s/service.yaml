apiVersion: v1
kind: Service
metadata:
  name: server-failure-api
spec:
  selector: {app: server-failure-api}
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: server-failure-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: server-failure-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
