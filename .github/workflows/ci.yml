name: course-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structure, sections, syntax and links
        run: python scripts/validate_repo.py

  examples:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run lesson examples
        run: python scripts/run_examples.py
      - name: Project tests
        run: |
          cd projects/02-python-calculator && pytest -q && cd -
          cd projects/03-log-file-analyzer && pytest -q && cd -
          cd projects/04-linux-system-health-checker && pytest -q && cd -
          cd projects/05-aws-automation-script && pytest -q && cd -
